name: Android debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Validate relay agent syntax
        run: python3 -m py_compile scripts/netswap-relay-agent.py
      - name: Test relay agent safety behavior
        run: python3 -m unittest discover -s tests -v
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test pinned userspace WireGuard wrapper
        working-directory: native/netswap-boringtun
        run: cargo test
      - name: Install Android NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" "ndk;27.2.12479018"
      - name: Install Android Rust target and cargo-ndk
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - name: Build WireGuard engine for Android ARM64
        run: cargo ndk -t arm64-v8a build --release --manifest-path native/netswap-boringtun/Cargo.toml
      - name: Package native ARM64 library into Android app
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native/netswap-boringtun/target/aarch64-linux-android/release/libnetswap_boringtun.so app/src/main/jniLibs/arm64-v8a/libnetswap_boringtun.so
      - name: Run Android unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetSwap-debug
          path: app/build/outputs/apk/debug/app-debug.apk
