name: Android debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Validate relay agent syntax
        run: python3 -m py_compile scripts/netswap-relay-agent.py
      - name: Test relay agent safety behavior
        run: python3 -m unittest discover -s tests -v
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test pinned userspace WireGuard wrapper
        working-directory: native/netswap-boringtun
        run: cargo test --locked
      - name: Run Android unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetSwap-debug
          path: app/build/outputs/apk/debug/app-debug.apk
